<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #f5f5f5;
    }
    .container {
      background: white;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h2 {
      margin: 0 0 16px 0;
      font-size: 16px;
      color: #333;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }
    input, select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }
    input:disabled, select:disabled {
      background: #f0f0f0;
      cursor: not-allowed;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 8px;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .ticket-display {
      background: #e8f4fd;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 16px;
      text-align: center;
    }
    .ticket-number {
      font-size: 20px;
      font-weight: bold;
      color: #007bff;
    }
    .no-ticket {
      color: #999;
      font-size: 12px;
    }
    .success {
      background: #d4edda;
      color: #155724;
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      margin-top: 8px;
      display: none;
    }
    .error {
      background: #f8d7da;
      color: #721c24;
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="ticket-display">
      <div class="ticket-number" id="ticketNumber">Loading...</div>
      <div class="no-ticket" id="noTicketMsg" style="display: none;">No Zendesk ticket detected</div>
    </div>
    
    <h2>Ticket Status</h2>
    
    <div class="form-group">
      <label for="email">Agent Email *</label>
      <input type="email" id="email" placeholder="Enter your email">
    </div>
    
    <div class="form-group">
      <label for="status">Status *</label>
      <select id="status" disabled>
        <option value="">Select status</option>
        <option value="Open">Open</option>
        <option value="Pending">Pending</option>
        <option value="Solved">Solved</option>
        <option value="On-Hold">On-Hold</option>
      </select>
    </div>
    
    <button id="submitBtn" disabled>Submit to Database</button>
    
    <div class="success" id="successMsg">Saved successfully!</div>
    <div class="error" id="errorMsg"></div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>

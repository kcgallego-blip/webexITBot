<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --surface: #101820;
      --surface-container: #17212b;
      --surface-container-high: #233142;
      --on-surface: #eef3f7;
      --on-surface-variant: #b8c2cc;
      --primary: #75d1c8;
      --primary-container: #0f766e;
      --on-primary: #05201d;
      --outline: #748391;
      --success: #73d99f;
      --warning: #f7c768;
      --error: #ffb4ab;
    }

    [data-theme="light"] {
      --surface: #fbfcfd;
      --surface-container: #eef3f5;
      --surface-container-high: #dce6ea;
      --on-surface: #162027;
      --on-surface-variant: #52616c;
      --primary: #087a72;
      --primary-container: #9ee5dd;
      --on-primary: #ffffff;
      --outline: #8b9aa4;
    }

    body {
      width: 292px;
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 12px;
      background: var(--surface);
      color: var(--on-surface);
      transition: background 0.2s ease, color 0.2s ease;
    }

    .panel {
      background: var(--surface-container);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.24);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 650;
      color: var(--on-surface);
    }

    .theme-toggle {
      width: 32px;
      height: 18px;
      background: var(--surface-container-high);
      border-radius: 9999px;
      position: relative;
      cursor: pointer;
    }

    .theme-toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      background: var(--primary);
      border-radius: 50%;
      transition: transform 0.2s ease;
    }

    [data-theme="light"] .theme-toggle::after {
      transform: translateX(14px);
    }

    .notice {
      display: none;
      background: rgba(247, 199, 104, 0.14);
      color: var(--warning);
      border: 1px solid rgba(247, 199, 104, 0.24);
      border-radius: 6px;
      font-size: 11px;
      line-height: 1.4;
      padding: 8px;
      margin-bottom: 12px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 11px;
      color: var(--on-surface-variant);
      margin-bottom: 4px;
      font-weight: 550;
    }

    input {
      width: 100%;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(116, 131, 145, 0.32);
      border-radius: 6px;
      font-size: 13px;
      color: var(--on-surface);
      box-sizing: border-box;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    [data-theme="light"] input {
      background: rgba(0, 0, 0, 0.04);
      border-color: rgba(0, 0, 0, 0.14);
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(117, 209, 200, 0.22);
    }

    button {
      width: 100%;
      padding: 10px;
      background: var(--primary);
      color: var(--on-primary);
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .success,
    .error {
      padding: 8px;
      border-radius: 6px;
      font-size: 11px;
      line-height: 1.4;
      margin-top: 8px;
      display: none;
    }

    .success {
      background: rgba(115, 217, 159, 0.14);
      color: var(--success);
    }

    .error {
      background: rgba(255, 180, 171, 0.14);
      color: var(--error);
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="header">
      <h2>Ticket Helper</h2>
      <div class="theme-toggle" id="themeToggle" title="Toggle theme"></div>
    </div>

    <div class="notice" id="setupNotice">Setup required before Zendesk submits can be logged.</div>

    <div class="form-group">
      <label for="name">Name *</label>
      <input type="text" id="name" autocomplete="name" placeholder="Enter your name">
    </div>

    <div class="form-group">
      <label for="email">Email *</label>
      <input type="email" id="email" autocomplete="email" placeholder="Enter your email">
    </div>

    <button id="saveBtn" disabled>Save</button>

    <div class="success" id="successMsg"></div>
    <div class="error" id="errorMsg"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>

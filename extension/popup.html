<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --surface: #0b1326;
      --surface-container: #171f33;
      --surface-container-high: #222a3d;
      --on-surface: #dae2fd;
      --on-surface-variant: #c4c6d1;
      --primary: #afc6ff;
      --primary-container: #34518d;
      --on-primary: #082e68;
      --outline: #8e909b;
      --success: #4ade80;
      --error: #ffb4ab;
    }

    [data-theme="light"] {
      --surface: #ffffff;
      --surface-container: #f8fafc;
      --surface-container-high: #e2e8f0;
      --on-surface: #0f172a;
      --on-surface-variant: #475569;
      --primary: #415d9a;
      --primary-container: #93b4ff;
      --on-primary: #ffffff;
      --outline: #94a3b8;
    }

    body {
      width: 280px;
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 12px;
      background: var(--surface);
      color: var(--on-surface);
      transition: background 0.3s ease, color 0.3s ease;
      position: relative;
    }

    .glass-container {
      background: rgba(11, 19, 38, 0.6);
      backdrop-filter: blur(12px);
      border: none;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    [data-theme="light"] .glass-container {
      background: rgba(248, 250, 252, 0.7);
      border: none;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--on-surface);
      font-family: 'Hanken Grotesk', -apple-system, sans-serif;
    }

    .theme-toggle {
      width: 32px;
      height: 18px;
      background: var(--surface-container-high);
      border-radius: 9999px;
      position: relative;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .theme-toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      background: var(--primary);
      border-radius: 50%;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="light"] .theme-toggle::after {
      transform: translateX(14px);
    }

    .ticket-display {
      background: rgba(175, 198, 255, 0.1);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 16px;
      text-align: center;
    }

    [data-theme="light"] .ticket-display {
      background: rgba(65, 93, 154, 0.1);
    }

    .ticket-number {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
      font-family: 'Hanken Grotesk', sans-serif;
    }

    .no-ticket {
      color: var(--on-surface-variant);
      font-size: 11px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 11px;
      color: var(--on-surface-variant);
      margin-bottom: 4px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    select, input {
      width: 100%;
      padding: 8px 10px;
      appearance: none;
      background: rgba(11, 19, 38, 0.3);
      border: 1px solid rgba(142, 144, 155, 0.2);
      border-radius: 6px;
      font-size: 13px;
      color: var(--on-surface);
      box-sizing: border-box;
      transition: all 0.2s ease;
    }

    [data-theme="light"] select, [data-theme="light"] input {
      background: rgba(0, 0, 0, 0.04);
      border-color: rgba(0, 0, 0, 0.12);
    }

    select option {
      background: var(--surface-container);
      color: var(--on-surface);
    }

    [data-theme="light"] select option {
      background: #f8fafc;
      color: #0f172a;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(175, 198, 255, 0.3);
    }

    input:disabled, select:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, var(--primary-container), var(--primary));
      color: var(--on-primary);
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(65, 93, 154, 0.3);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .success {
      background: rgba(74, 222, 128, 0.15);
      color: var(--success);
      padding: 8px;
      border-radius: 6px;
      font-size: 11px;
      margin-top: 8px;
      display: none;
    }

    .error {
      background: rgba(255, 180, 171, 0.15);
      color: var(--error);
      padding: 8px;
      border-radius: 6px;
      font-size: 11px;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="glass-container">
    <div class="header">
      <h2>Ticket Helper</h2>
      <div class="theme-toggle" id="themeToggle"></div>
    </div>

    <div class="ticket-display">
      <div class="ticket-number" id="ticketNumber">Loading...</div>
      <div class="no-ticket" id="noTicketMsg" style="display: none;">No ticket detected</div>
    </div>

    <div class="form-group">
      <label for="email">Agent Email *</label>
      <input type="email" id="email" placeholder="Enter your email">
    </div>

    <div class="form-group">
      <label for="status">Status *</label>
      <select id="status" disabled>
        <option value="">Select status</option>
        <option value="Open">Open</option>
        <option value="Pending">Pending</option>
        <option value="Solved">Solved</option>
        <option value="On-Hold">On-Hold</option>
      </select>
    </div>

    <button id="submitBtn" disabled>Submit</button>

    <div class="success" id="successMsg">Saved successfully!</div>
    <div class="error" id="errorMsg"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
